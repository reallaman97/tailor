<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Resume Generator</title>
    <style>
      :root { color-scheme: light dark; --teal: #0f766e; --border: color-mix(in srgb, CanvasText 18%, Canvas); --muted: color-mix(in srgb, CanvasText 55%, Canvas); }
      * { box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; width: 320px; margin: 0; padding: 14px; background: Canvas; color: CanvasText; }
      h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 7px; }
      h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
      .row { font-size: 13px; margin: 5px 0; }
      .muted { color: var(--muted); }
      .ok { color: #15803d; } .err { color: #b91c1c; } .warn { color: #b45309; }

      /* Account block */
      .account { border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; margin-bottom: 10px; }
      .account .who { font-weight: 600; }

      /* Job status card */
      .card { border: 1px solid var(--border); border-radius: 10px; padding: 11px; margin-bottom: 10px; display: none; }
      .card.show { display: block; }
      .card .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .card .stage { font-weight: 600; font-size: 13px; }
      .card .elapsed { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .bar { height: 7px; border-radius: 999px; background: color-mix(in srgb, CanvasText 12%, Canvas); overflow: hidden; margin: 9px 0 8px; }
      .bar > i { display: block; height: 100%; width: 0%; border-radius: 999px; background: var(--teal); transition: width .35s ease; }
      .bar.done > i { background: #15803d; }
      .bar.err > i { background: #b91c1c; }
      .bar.warn > i { background: #b45309; }
      .bar.indeterminate > i { width: 35% !important; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
      .detail { font-size: 12px; color: var(--muted); margin: 3px 0; word-break: break-word; }
      .detail strong { color: CanvasText; font-weight: 600; }
      .card a.link { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--teal); }

      button { margin-top: 4px; width: 100%; padding: 8px; font-size: 13px; font-weight: 600; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: CanvasText; cursor: pointer; }
      button:hover { background: color-mix(in srgb, CanvasText 6%, Canvas); }
      .hint { font-size: 12px; margin: 10px 0 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <h1><span class="dot"></span> Resume Generator</h1>

    <div class="account">
      <div class="row" id="status">Checking…</div>
      <div class="row muted" id="profile"></div>
    </div>

    <div class="card" id="jobCard">
      <div class="head">
        <span class="stage" id="jobStage"></span>
        <span class="elapsed" id="jobElapsed"></span>
      </div>
      <div class="bar" id="jobBar"><i id="jobBarFill"></i></div>
      <div class="detail" id="jobDetail"></div>
      <a class="link" id="jobLink" href="#" target="_blank" rel="noopener" style="display:none"></a>
    </div>

    <button id="openOptions">Settings</button>
    <p class="hint">Select a job description on any page, right-click, and choose <strong>Generate resume</strong>.</p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
